name: Publish Release

# Expects the pushed tag to point at the same commit as master's tip at release time (see README/commit
# workflow) - the repo.json update this workflow commits lands on master, not on the tag itself.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  release:
    runs-on: windows-2022

    steps:
    - name: Checkout tagged commit
      uses: actions/checkout@v5
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        submodules: 'recursive'

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud-latest.zip
        Expand-Archive -Force dalamud-latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build Oathbound.Plugin/Oathbound.Plugin.csproj --configuration Release

    - name: Read plugin manifest
      id: manifest
      shell: pwsh
      run: |
        $manifest = Get-Content "Oathbound.Plugin/bin/x64/Release/Oathbound.Plugin/Oathbound.Plugin.json" | ConvertFrom-Json
        "version=$($manifest.AssemblyVersion)" >> $env:GITHUB_OUTPUT
        "apilevel=$($manifest.DalamudApiLevel)" >> $env:GITHUB_OUTPUT
        # A `-testing` tag only reaches users who opted into testing builds; stable stays where it is.
        "testing=$('${{ github.ref_name }}'.EndsWith('-testing'))".ToLower() >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        prerelease: ${{ steps.manifest.outputs.testing == 'true' }}
        files: Oathbound.Plugin/bin/x64/Release/Oathbound.Plugin/latest.zip

    # Build/package must come from the immutable tag above. Switch back to master only for the mutable
    # repository index update committed after a successful release.
    - name: Checkout master for repository metadata
      uses: actions/checkout@v5
      with:
        ref: master
        fetch-depth: 0

    - name: Update repo.json
      shell: pwsh
      run: |
        $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.zip"
        $repo = Get-Content repo.json | ConvertFrom-Json
        # Dalamud ignores a testing version unless TestingDalamudApiLevel matches its own API level.
        if ("${{ steps.manifest.outputs.testing }}" -eq "true") {
          $repo[0].TestingAssemblyVersion = "${{ steps.manifest.outputs.version }}"
          $repo[0] | Add-Member -Force -NotePropertyName TestingDalamudApiLevel -NotePropertyValue ([int]"${{ steps.manifest.outputs.apilevel }}")
        } else {
          $repo[0].AssemblyVersion = "${{ steps.manifest.outputs.version }}"
          $repo[0].TestingAssemblyVersion = $null
          $repo[0] | Add-Member -Force -NotePropertyName TestingDalamudApiLevel -NotePropertyValue $null
          $repo[0].DownloadLinkInstall = $downloadUrl
          $repo[0].DownloadLinkUpdate = $downloadUrl
        }
        $repo[0].DalamudApiLevel = [int]"${{ steps.manifest.outputs.apilevel }}"
        $repo[0].DownloadLinkTesting = $downloadUrl
        $repo[0].LastUpdate = [string]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
        # -AsArray is required here: piping a single-element collection through ConvertTo-Json otherwise
        # unwraps it to a bare JSON object instead of a one-element array, which Dalamud's PluginMaster
        # refuses to deserialize (it expects a JSON array at the top level).
        $repo | ConvertTo-Json -Depth 5 -AsArray | Set-Content repo.json

    - name: Commit repo.json
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: point repo.json at ${{ github.ref_name }}"
        file_pattern: repo.json
        branch: master
