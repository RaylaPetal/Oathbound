name = "oathbound-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Base config intentionally has no bindings and is never deployed directly;
# `wrangler dev` / `wrangler deploy` always take an explicit --env so a
# developer cannot accidentally target production. See docs/deployment.md
# (added in task 8.4) for account setup and how to fill in the placeholder
# ids below.

[env.local]
vars = { RELAY_ENVIRONMENT = "local", CIRCUIT_BREAKER_FORCE_OPEN = "false", GLOBAL_CHARGE_SAMPLING = "1" }

[[env.local.d1_databases]]
binding = "RELAY_DB"
database_name = "oathbound-relay-local"
database_id = "local-only-placeholder"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "RELAY_CATALOG_BUCKET"
bucket_name = "oathbound-relay-catalog-local"

# The general per-origin flood guard. Kept out of D1 so it costs no row writes; the capability-guessing
# limits stay in D1 because they need one global count.
[[env.local.ratelimits]]
name = "ORIGIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[env.local.observability]
[env.local.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
[env.local.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[env.staging]
vars = { RELAY_ENVIRONMENT = "staging", CIRCUIT_BREAKER_FORCE_OPEN = "false", GLOBAL_CHARGE_SAMPLING = "4" }

[[env.staging.d1_databases]]
binding = "RELAY_DB"
database_name = "oathbound-relay-staging"
database_id = "7a613556-8574-4ad6-bf64-ac23d05c22ce"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "RELAY_CATALOG_BUCKET"
bucket_name = "oathbound-relay-catalog-staging"

[env.staging.triggers]
crons = ["*/15 * * * *"]

[[env.staging.ratelimits]]
name = "ORIGIN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[env.staging.observability]
[env.staging.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
[env.staging.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[env.production]
vars = { RELAY_ENVIRONMENT = "production", CIRCUIT_BREAKER_FORCE_OPEN = "false", GLOBAL_CHARGE_SAMPLING = "4" }

[[env.production.d1_databases]]
binding = "RELAY_DB"
database_name = "oathbound-relay-production"
database_id = "REPLACE_WITH_PRODUCTION_D1_ID"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "RELAY_CATALOG_BUCKET"
bucket_name = "oathbound-relay-catalog-production"

[env.production.triggers]
crons = ["*/15 * * * *"]

[[env.production.ratelimits]]
name = "ORIGIN_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[env.production.observability]
[env.production.observability.logs]
enabled = true
# Logs bill per event and every request emits one; a 10% sample still shows patterns. Staging keeps full logging.
head_sampling_rate = 0.1
invocation_logs = false
persist = true
[env.production.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
